.xlsx","empresa":{"A1":"NOMBRE DE LA EMPRESA","B1":"Grupo Nutresa S.A.","A2":"PERIODO DE VIGENCIA DEL PLAN","B2":"AÑO INCIO","C2":2026,"D2":"AÑO FINAL","E2":2030,"A4":"MISION","B4":"Crear valor de manera creciente y sostenible para nuestros accionistas, consumidores, colaboradores y comunidades, ofreciendo alimentos de marcas líderes, nutritivas e innovadoras en Colombia y en las geografías donde operamos, con una operación enfocada en el core, eficiente y productiva, que genere un retorno sobre el capital invertido superior a su costo.","A5":"VISION","B5":"En 2030, Grupo Nutresa será la empresa de alimentos líder y más competitiva de la región bajo el modelo One Nutresa, generando valor económico agregado (EVA) positivo, con una estructura financiera sólida, un portafolio innovador que sea la elección preferida en los hogares y un talento humano transformador comprometido con la sostenibilidad.","A6":"PRINCIPIOS","B6":"1. Creación de valor: toda decisión de inversión y crecimiento debe generar una rentabilidad superior al costo promedio ponderado de capital (WACC).\\n2. Actuación íntegra: gestión ética, transparente y con buen gobierno corporativo frente a accionistas, inversionistas y demás grupos de interés.\\n3. Consumidor en el centro: el portafolio y la innovación responden a las necesidades y tendencias de consumo, promoviendo una vida saludable.\\n4. Disciplina financiera: crecimiento rentable con un nivel de endeudamiento prudente y una gestión eficiente del capital de trabajo.\\n5. Sostenibilidad: gestión responsable de la cadena de valor y reducción del impacto ambiental y social de las operaciones.","A7":"VALORES","B7":"Colaboración: trabajamos como una sola organización (One Nutresa), integrando negocios y geografías.\\nVisión global: pensamos y competimos con perspectiva regional e internacional.\\nCompetitividad: buscamos ser más eficientes, ágiles y productivos cada día.\\nTransformación: nos adaptamos, innovamos y evolucionamos ante los cambios del entorno.\\nDiversidad e inclusión: valoramos las diferencias y promovemos el respeto y la equidad.","A8":"OBJETIVOS ESTRATEGICOS","B8":"PERSPECTIVA FINANCIERA\\nF1. Generar valor económico agregado (EVA) positivo, logrando que la rentabilidad operativa Fsupere el costo de capital.\\nF2. Lograr un crecimiento rentable de los ingresos, ampliando el margen EBITDA.\\nF3. Fortalecer la estructura financiera, reduciendo el nivel de endeudamiento y mejorando la cobertura de intereses.\\n\\nPERSPECTIVA CLIENTES\\nC1. Consolidar el liderazgo regional, aumentando la penetración de mercado en Colombia y en las ventas internacionales.\\nC2. Fortalecer la preferencia y la lealtad de los consumidores hacia las marcas del portafolio.\\nC3. Ampliar el portafolio con innovaciones relevantes y saludables para el consumidor.\\n\\nPERSPECTIVA PROCESOS INTERNOS\\nP1. Optimizar la gestión del capital de trabajo, reduciendo el ciclo de caja.\\nP2. Incrementar la productividad y la eficiencia en costos de la operación enfocada en el core.\\nP3. Gestionar de forma sostenible la cadena de valor, reduciendo el impacto ambiental.\\n\\nPERSPECTIVA CAPACIDADES ESTRATÉGICAS\\nK1. Desarrollar el talento humano mediante programas de reskilling y upskilling.\\nK2. Acelerar la transformación digital y la automatización de procesos.\\nK3. Consolidar la cultura organizacional One Nutresa."},"mapa":{"A1":"Grupo Nutresa S.A.","C1":"MAPA ESTRATÉGICO","D1":"Plan Estratégico","E1":"año inicio: 2026 año final: 2030","A3":"PERSPECTIVA FINANCIERA","B3":"Optimizar la estructura de costos y gastos de la operación core para ampliar el margen EBITDA. (F2)","C3":"Prepagar y refinanciar deuda con el flujo de caja libre para reducir la relación Deuda neta/EBITDA y el costo financiero. (F3)","D3":"Priorizar inversiones (CAPEX) con rentabilidad superior al WACC y desinvertir activos que no generen valor, para alcanzar un EVA positivo. (F1)","E3":"Crecer los ingresos en categorías y geografías de mayor margen, manteniendo la palanca de crecimiento (PDC) superior a 1. (F2)","A4":"PERSPECTIVA CLIENTES","B4":"Fortalecer la estrategia Go-to-Market y la cobertura de canales para llegar a más hogares con un menor costo de servir. (C1)","C4":"Fortalecer las marcas líderes con un mercadeo más efectivo y una mejor experiencia del consumidor para aumentar su preferencia y lealtad. (C2)","D4":"Gestionar el precio y la mezcla de portafolio (revenue management) hacia productos de mayor valor percibido y mejor margen. (C1, C2)","E4":"Lanzar innovaciones saludables y ampliar el portafolio en los mercados internacionales para consolidar el liderazgo regional. (C1, C3)","A5":"PERSPECTIVA PROCESOS INTERNOS","B5":"Reducir los días de inventario mediante planeación integrada de demanda y oferta (S&OP) y optimización logística. (P1)","C5":"Implementar un programa de productividad y mejora continua en las plantas y procesos enfocados en el core. (P2)","D5":"Optimizar el capital de trabajo neto operativo (KTNO): gestión de cartera y negociación de plazos con proveedores para reducir el ciclo de caja. (P1)","E5":"Reducir el consumo de energía y agua, las emisiones y el material de empaque, con un abastecimiento responsable en la cadena de valor. (P3)","A6":"PERSPECTIVA  CAPACIDADES ESTRATEGICAS","B6":"Automatizar procesos operativos y administrativos con tecnología digital e inteligencia artificial. (K2)","C6":"Ampliar los programas de reskilling, upskilling y formación de líderes en finanzas, estrategia y liderazgo. (K1)","D6":"Vincular el sistema de evaluación e incentivos de los directivos a los resultados del EVA y del Cuadro de Mando Integral. (K3)","E6":"Consolidar la cultura One Nutresa, la diversidad e inclusión y la gestión del conocimiento entre negocios y geografías. (K3)","B7":"Mejorar eficiencia","C7":"Incrementar Excelencia","D7":"Generar Valor","E7":"Crecimiento sostenible"},"indicadores":{"header":{"A":"Perspectiva","B":"Objetivo","C":"Definición del Objetivo","D":"Nombre del ndicador","E
